services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      IMAGES: 1
      INFO: 1
      VERSION: 1
    networks:
      - backend

  jupyterhub:
    build: .
    image: jupyterhub-custom
    container_name: jupyterhub-container
    ports:
      - "8533:8000"
    depends_on:
      - db
      - docker-socket-proxy
    env_file: .env
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ./templates:/srv/jupyterhub/templates
    # - ./jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py
      - jupyterhub_data:/srv/jupyterhub/data
    #  - ./logService.py:/srv/jupyterhub/logService.py
    networks:
      - backend
      - students
    extra_hosts:
      - "host.docker.internal:127.17.0.1"

  db:
    image: mongo:8.0
    hostname: mongodb
    mem_limit: 2g
    cpus: '1.0'
    pids_limit: 200
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      - MONGO_INITDB_DATABASE=loggedData
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
      - ./mongodbvolume:/data/db
    networks:
      - backend

volumes:
  jupyterhub_data:

networks:
  backend:
    name: backend
    internal: true
  students:
    name: students
    driver: bridge
    internal: true